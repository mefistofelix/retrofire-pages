<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RetroFire · Aggiungi repository</title>
<style>
  :root { --bg:#10141a; --card:#1a212b; --line:#2c3644; --text:#e8edf3; --dim:#93a1b3; --accent:#ff7a1a; --ok:#3ccf7a; --err:#ff5a5a; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.45 system-ui, sans-serif; }
  main { max-width:560px; margin:0 auto; padding:20px 16px 48px; }
  h1 { font-size:22px; margin:4px 0 2px; }
  .tv { color:var(--dim); margin-bottom:18px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; margin:12px 0; }
  .repo { display:flex; gap:12px; align-items:flex-start; padding:10px 0; border-top:1px solid var(--line); }
  .repo:first-child { border-top:0; }
  .repo input[type=checkbox] { width:22px; height:22px; margin-top:2px; accent-color:var(--accent); }
  .repo .name { font-weight:600; }
  .repo .url { color:var(--dim); font-size:13px; word-break:break-all; }
  .repo button { margin-left:auto; background:none; border:0; color:var(--dim); font-size:20px; }
  label { display:block; font-size:14px; color:var(--dim); margin:10px 0 4px; }
  input[type=text], input[type=password] { width:100%; padding:11px 12px; border-radius:8px; border:1px solid var(--line); background:#0d1117; color:var(--text); font-size:16px; }
  .btn { display:block; width:100%; padding:14px; border:0; border-radius:10px; font-size:17px; font-weight:600; margin-top:14px; }
  .primary { background:var(--accent); color:#111; }
  .secondary { background:#273140; color:var(--text); }
  .btn:disabled { opacity:.45; }
  .status { margin-top:14px; min-height:24px; }
  .ok { color:var(--ok); } .err { color:var(--err); }
  .hint { color:var(--dim); font-size:13px; }
  .empty { color:var(--dim); }
</style>
</head>
<body>
<main>
  <h1>Aggiungi repository</h1>
  <div class="tv" id="tv">RetroFire</div>

  <div class="card">
    <div id="list"></div>
    <button class="btn primary" id="send">Invia alla TV</button>
    <div class="status" id="status"></div>
  </div>

  <div class="card">
    <strong>Nuovo repository</strong>
    <label for="name">Nome</label>
    <input type="text" id="name" placeholder="es. Giochi di casa" autocomplete="off">
    <label for="url">Link della cartella (MEGA) o indirizzo base</label>
    <input type="text" id="url" placeholder="https://mega.nz/folder/…#…" autocomplete="off" autocapitalize="off">
    <label for="pw">Password</label>
    <input type="password" id="pw" autocomplete="off">
    <button class="btn secondary" id="add">Salva in questo telefono</button>
    <p class="hint">I repository restano salvati solo in questo browser. Alla TV arrivano cifrati con la chiave del QR, che solo lei conosce.</p>
  </div>
</main>

<script type="module">
import * as ed from "https://cdn.jsdelivr.net/npm/@noble/ed25519@2.1.0/+esm";

// pkarr (the signed DNS records iroh uses to find its nodes): the TV's QR carries an Ed25519
// key seed and an AES key; this page signs a DNS packet with one TXT record, "_rf", holding
// the chosen repositories (deflate, then AES-256-GCM with the QR key, additional data = the
// public key in z-base-32), and PUTs it to the pkarr relays. The TV GETs it from them.
const RELAYS = ["https://relay.pkarr.org", "https://dns.iroh.link/pkarr", "https://pkarr.pubky.app", "https://pkarr.pubky.org"];
const STORE = "retrofire.repos";
const $ = (id) => document.getElementById(id);

const params = new URLSearchParams(location.hash.slice(1));
const seedB64 = params.get("s") || "";
const keyB64 = params.get("k") || "";
const device = params.get("d") || "Fire TV";
const ready = seedB64 && keyB64;
$("tv").textContent = ready ? `Per: ${device}` : "Apri questa pagina dal QR che mostra la TV (menu della griglia → Repository → Aggiungi repository).";

function load() { try { return JSON.parse(localStorage.getItem(STORE) || "[]"); } catch { return []; } }
function save(list) { try { localStorage.setItem(STORE, JSON.stringify(list)); } catch {} }
let repos = load();

function render() {
  const list = $("list");
  list.innerHTML = "";
  if (!repos.length) { list.innerHTML = '<div class="empty">Nessun repository salvato: aggiungine uno qui sotto.</div>'; }
  repos.forEach((r, i) => {
    const row = document.createElement("div");
    row.className = "repo";
    row.innerHTML = `<input type="checkbox" ${r.checked !== false ? "checked" : ""}>
      <div><div class="name"></div><div class="url"></div></div><button title="Elimina">✕</button>`;
    row.querySelector(".name").textContent = r.name || "(senza nome)";
    row.querySelector(".url").textContent = r.url;
    row.querySelector("input").onchange = (e) => { r.checked = e.target.checked; save(repos); };
    row.querySelector("button").onclick = () => {
      if (confirm(`Eliminare "${r.name}" da questo telefono?`)) { repos.splice(i, 1); save(repos); render(); }
    };
    list.appendChild(row);
  });
  $("send").disabled = !ready || !repos.some((r) => r.checked !== false);
}

$("add").onclick = () => {
  const r = { name: $("name").value.trim(), url: $("url").value.trim(), password: $("pw").value, checked: true };
  if (!r.url || !r.password) { status("Servono il link e la password.", true); return; }
  if (!r.name) r.name = r.url.replace(/^https?:\/\//, "").slice(0, 30);
  repos = repos.filter((x) => x.url !== r.url).concat([r]);
  save(repos);
  $("name").value = $("url").value = $("pw").value = "";
  render();
  status("Salvato.");
};

function status(text, bad) { const s = $("status"); s.textContent = text; s.className = "status " + (bad ? "err" : "ok"); }

function b64url(bytes) { let s = ""; for (const b of bytes) s += String.fromCharCode(b); return btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, ""); }
function unb64url(s) { s = s.replace(/-/g, "+").replace(/_/g, "/"); while (s.length % 4) s += "="; return Uint8Array.from(atob(s), (c) => c.charCodeAt(0)); }

const Z32 = "ybndrfg8ejkmcpqxot1uwisza345h769";
function z32(bytes) {
  let out = "", bits = 0, value = 0;
  for (const b of bytes) { value = (value << 8) | b; bits += 8; while (bits >= 5) { out += Z32[(value >>> (bits - 5)) & 31]; bits -= 5; } }
  if (bits > 0) out += Z32[(value << (5 - bits)) & 31];
  return out;
}

async function deflate(bytes) {
  const cs = new CompressionStream("deflate-raw");
  const stream = new Blob([bytes]).stream().pipeThrough(cs);
  return new Uint8Array(await new Response(stream).arrayBuffer());
}

function concat(...parts) {
  const out = new Uint8Array(parts.reduce((n, p) => n + p.length, 0));
  let o = 0;
  for (const p of parts) { out.set(p, o); o += p.length; }
  return out;
}

// DNS message with one answer: _rf TXT <payload in strings of at most 255 bytes>
function dnsPacket(text) {
  const data = new TextEncoder().encode(text);
  const chunks = [];
  for (let i = 0; i < data.length; i += 255) { const c = data.slice(i, i + 255); chunks.push(Uint8Array.of(c.length), c); }
  const rdata = concat(...chunks);
  const name = concat(Uint8Array.of(3), new TextEncoder().encode("_rf"), Uint8Array.of(0));
  const header = Uint8Array.of(0, 0, 0x84, 0, 0, 0, 0, 1, 0, 0, 0, 0);
  const fixed = Uint8Array.of(0, 16, 0, 1, 0, 0, 1, 44, rdata.length >> 8, rdata.length & 255);   // TXT IN ttl 300
  return concat(header, name, fixed, rdata);
}

async function signedPacket(payload) {
  const seed = unb64url(seedB64);
  const pub = await ed.getPublicKeyAsync(seed);
  const zkey = z32(pub);
  const raw = unb64url(keyB64);
  if (raw.length !== 32 || seed.length !== 32) throw new Error("codice QR non valido");
  const key = await crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["encrypt"]);
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const packed = await deflate(new TextEncoder().encode(JSON.stringify(payload)));
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name: "AES-GCM", iv, additionalData: new TextEncoder().encode(zkey) }, key, packed));
  const packet = dnsPacket(b64url(concat(iv, ct)));
  if (packet.length > 1000) throw new Error("troppi repository in un invio: scegline meno");
  const seq = BigInt(Date.now()) * 1000n;   // microseconds
  const msg = concat(new TextEncoder().encode(`3:seqi${seq}e1:v${packet.length}:`), packet);
  const sig = await ed.signAsync(msg, seed);
  const ts = new Uint8Array(8);
  new DataView(ts.buffer).setBigUint64(0, seq);
  return { zkey, body: concat(sig, ts, packet) };
}

async function put(relay, zkey, body) {
  try {
    const ctl = new AbortController();
    const timer = setTimeout(() => ctl.abort(), 10000);
    // no Content-Type: the iroh relay's CORS rules do not allow that header
    const r = await fetch(`${relay}/${zkey}`, { method: "PUT", body, signal: ctl.signal });
    clearTimeout(timer);
    return r.ok;
  } catch { return false; }
}

$("send").onclick = async () => {
  const chosen = repos.filter((r) => r.checked !== false).map(({ name, url, password }) => ({ name, url, password }));
  $("send").disabled = true;
  status("Invio…");
  try {
    const { zkey, body } = await signedPacket({ v: 1, repos: chosen });
    const results = await Promise.all(RELAYS.map((r) => put(r, zkey, body)));
    const n = results.filter(Boolean).length;
    if (n) status(`Inviato (${n} di ${RELAYS.length} server). Guarda la TV: tra pochi secondi conferma.`);
    else status("Nessun server ha accettato l'invio: riprova.", true);
  } catch (e) {
    status("Errore: " + e.message, true);
  }
  $("send").disabled = false;
};

render();
</script>
</body>
</html>
